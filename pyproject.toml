[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-chatbot-template"
version = "0.1.0"
description = "Streaming LLM chatbot backend template (FastAPI) with SSE token streaming, in-memory session memory, and a pluggable offline FakeLLM — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
  "llm",
  "chatbot",
  "chatbot-template",
  "conversational-ai",
  "fastapi",
  "streaming",
  "sse",
  "openai",
  "chat",
  "python",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.29"]
openai = ["openai>=1.30"]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
llm-chatbot-template = "llm_chatbot_template.cli:app"

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/llm-chatbot-template"
Issues = "https://github.com/Viprasol-Tech/llm-chatbot-template/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_chatbot_template"]
artifacts = ["src/llm_chatbot_template/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["B008", "B027", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# The OpenAI SDK is an optional, lazily-imported dependency; don't require its
# stubs to type-check the core package.
[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
