<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Chatbot Template — Viprasol Tech</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #181b24;
        --user: #2563eb;
        --bot: #232735;
        --text: #e7e9ee;
        --muted: #8b90a0;
        --accent: #26a5e4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 18px;
        background: var(--panel);
        border-bottom: 1px solid #262a36;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .tag { color: var(--muted); font-size: 12px; }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
      .user { align-self: flex-end; background: var(--user); }
      .bot { align-self: flex-start; background: var(--bot); }
      form {
        display: flex;
        gap: 8px;
        padding: 14px;
        background: var(--panel);
        border-top: 1px solid #262a36;
      }
      input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #2c313f;
        background: #0d0f15;
        color: var(--text);
        font-size: 14px;
      }
      button {
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>LLM Chatbot Template</h1>
      <span class="tag">streaming SSE demo · by <a href="https://viprasol.com">Viprasol Tech</a></span>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message and press Enter…" />
      <button id="send" type="submit">Send</button>
    </form>

    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const sessionId = "web-" + Math.random().toString(36).slice(2, 10);

      function bubble(text, cls) {
        const el = document.createElement("div");
        el.className = "msg " + cls;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        send.disabled = true;
        bubble(message, "user");
        const out = bubble("", "bot");

        try {
          const resp = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, message }),
          });
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const frames = buffer.split("\n\n");
            buffer = frames.pop() || "";
            for (const frame of frames) {
              const lines = frame.split("\n");
              const isDone = lines.some((l) => l === "event: done");
              if (isDone) continue;
              for (const line of lines) {
                if (line.startsWith("data: ")) out.textContent += line.slice(6);
              }
            }
            log.scrollTop = log.scrollHeight;
          }
        } catch (err) {
          out.textContent = "[error] " + err;
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      input.focus();
    </script>
  </body>
</html>
