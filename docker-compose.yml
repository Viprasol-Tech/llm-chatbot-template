# LLM Chatbot Template — by Viprasol Tech (https://viprasol.com)
services:
  chatbot:
    build: .
    image: viprasol/llm-chatbot-template:0.1.0
    ports:
      - "8000:8000"
    environment:
      # Defaults to the offline FakeLLM. To use a real backend, set:
      #   CHATBOT_PROVIDER: openai
      #   CHATBOT_OPENAI_API_KEY: ${CHATBOT_OPENAI_API_KEY}
      CHATBOT_PROVIDER: fake
      CHATBOT_SYSTEM_PROMPT: "You are a helpful, concise assistant."
      CHATBOT_MAX_TOKENS: "1024"
    # Load secrets from a local .env (never commit it) when going live:
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
